# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name figurekoreashop.com www.figurekoreashop.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name figurekoreashop.com www.figurekoreashop.com;

    ssl_certificate /etc/letsencrypt/live/figurekoreashop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/figurekoreashop.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/mohinhcaocap;
    index frontend/pages/index.html;

    access_log /var/log/nginx/mohinhcaocap.access.log;
    error_log /var/log/nginx/mohinhcaocap.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Trang chủ
    location = / {
        try_files /frontend/pages/index.html =404;
    }

    # HTML pages - redirect short URLs to frontend/pages/
    location ~* ^/([^/]+\.html)$ {
        try_files /frontend/pages/$1 =404;
    }

    # Uploads - phải đặt trước location /
    location /uploads/ {
        alias /var/www/mohinhcaocap/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Webhook
    location /webhook {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }
}
